spring.application.name=TicketingSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# This database already had its schema built up by Hibernate ddl-auto=update before
# Flyway was introduced, so there's no empty schema for V1 to run against. Baselining
# marks V1 as already applied instead of failing on "non-empty schema, no history table" -
# only V2+ actually execute here. A fresh/empty database (new dev setup, CI) skips
# baselining entirely and just runs every migration from V1 onward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Session/login cookie lasts 24h instead of the default 30-minute inactivity
# timeout and browser-session-only cookie.
server.servlet.session.timeout=24h
server.servlet.session.cookie.max-age=24h

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.attachments.dir=uploads

# The notification SSE stream's emitter is created with SseEmitter(0L) ("never
# times out"), but that only overrides the emitter's own timeout — Spring MVC's
# separate async-request timeout still applies underneath and defaults to ~30s.
# Left unset, every SSE connection silently expires after ~30s regardless of
# the 0L, and rapid page navigation (new EventSource per page load) piles up
# enough of these to all expire in the same instant, each throwing
# AsyncRequestTimeoutException followed by a secondary HttpMediaTypeNotAcceptableException
# (no text/event-stream converter for the error response). -1 disables it to
# match what SseEmitter(0L) already intended.
spring.mvc.async.request-timeout=-1

# Same SSE emitter, a different async gotcha: Spring Security re-runs the
# whole filter chain (including authorization) on every ASYNC re-dispatch
# Tomcat performs for a long-lived SseEmitter, but the SecurityContext isn't
# reliably available on those internal re-dispatches — they're not real
# incoming requests from the browser, just the container continuing the
# already-open stream. That intermittently threw AuthorizationDeniedException
# and silently killed the connection (and with it, every push queued behind
# it), which is why notifications were unreliable even for the right user.
# The initial REQUEST dispatch already authenticated/authorized the emitter
# once; excluding ASYNC here just stops re-checking on every continuation.
spring.security.filter.dispatcher-types=REQUEST,ERROR,FORWARD,INCLUDE

spring.config.import=optional:application-local.properties