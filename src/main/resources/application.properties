spring.application.name=TicketingSystem
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# This database already had its schema built up by Hibernate ddl-auto=update before
# Flyway was introduced, so there's no empty schema for V1 to run against. Baselining
# marks V1 as already applied instead of failing on "non-empty schema, no history table" -
# only V2+ actually execute here. A fresh/empty database (new dev setup, CI) skips
# baselining entirely and just runs every migration from V1 onward.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Session/login cookie lasts 24h instead of the default 30-minute inactivity
# timeout and browser-session-only cookie.
server.servlet.session.timeout=24h
server.servlet.session.cookie.max-age=24h

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.attachments.dir=uploads

spring.config.import=optional:application-local.properties