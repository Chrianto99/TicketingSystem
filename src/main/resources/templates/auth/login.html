<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <h1>Ticketing System</h1>
        <p th:if="${param.error}" class="modal-error">Invalid username or password.</p>
        <p th:if="${param.logout}" class="field-label">You have been logged out.</p>
        <form th:action="@{/login}" method="post" class="auth-form">
            <label>
                Username
                <input type="text" name="username" autofocus="autofocus" required="required">
            </label>
            <label>
                Password
                <input type="password" name="password" required="required">
            </label>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </div>
</main>
</body>
</html>
