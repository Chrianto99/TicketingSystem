<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:replace="~{fragments/nav :: theme-init}"></script>
    <title>Σύνδεση</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>
<main class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><img th:src="@{/img/gepLogo.png}" alt="Ticketing System"></div>
        <!--        <p class="auth-hint">όνομα χρήστη: [αρχικό_ονόματος].[επώνυμο]<br>κωδικός: qwerty123</p>-->
        <p th:if="${param.error != null and param.error[0] == 'disabled'}" class="modal-error">Ο λογαριασμός σας είναι απενεργοποιημένος. Επικοινωνήστε με τον διαχειριστή.</p>
        <p th:if="${param.error != null and param.error[0] != 'disabled'}" class="modal-error">Λανθασμένο όνομα χρήστη ή κωδικός πρόσβασης.</p>
        <p th:if="${param.logout}" class="field-label">Έχετε αποσυνδεθεί.</p>
        <form th:action="@{/login}" method="post" class="auth-form">
            <label>
                Όνομα χρήστη
                <input type="text" name="username" th:value="${param.username != null ? param.username[0] : ''}"
                       th:classappend="${param.error != null} ? 'input-error' : ''"
                       autofocus="autofocus" required="required">
            </label>
            <label>
                Κωδικός πρόσβασης
                <input type="password" name="password" th:classappend="${param.error != null} ? 'input-error' : ''"
                       required="required">
            </label>
            <button type="submit" class="btn btn-primary">Σύνδεση</button>
        </form>
    </div>
</main>
</body>
</html>
