<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script th:replace="~{fragments/nav :: theme-init}"></script>
    <title>Κατηγορίες Βλάβης</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: modals}"></div>

<main class="page">
    <div class="page-header">
        <div th:replace="~{fragments/nav :: admin-tabs('categories')}"></div>
    </div>

    <form th:object="${categoryRequest}" method="post" th:action="@{/categories}" class="filters" sec:authorize="hasRole('ADMIN')">
        <input type="text" th:field="*{name}" placeholder="Νέα κατηγορία βλάβης" required="required">
        <button type="submit" class="btn btn-primary">+ Προσθήκη Κατηγορίας</button>
    </form>

    <table class="entity-table">
        <thead>
        <tr>
            <th>Όνομα</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="category-list">
        <th:block th:each="category : ${activeCategories}">
        <tr class="entity-card" data-entity-row>
            <td class="entity-name">
                <span class="entity-edit-view">
                    <span th:text="${category.name}"></span>
                    <span class="entity-ticket-count" th:text="'(' + ${category.ticketCount} + ')'"></span>
                </span>
                <form method="post" th:action="@{/categories/{id}/edit(id=${category.id})}" class="entity-inline-edit-form" hidden="hidden">
                    <input type="text" name="name" th:value="${category.name}" required="required" aria-label="Όνομα κατηγορίας βλάβης">
                    <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                    <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                </form>
            </td>
            <td class="entity-actions-cell">
                <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                    <summary title="Επιλογές">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                        <div class="entity-menu-divider"></div>
                        <form method="post" th:action="@{/categories/{id}/toggle-active(id=${category.id})}"
                              data-confirm="Απενεργοποίηση αυτής της κατηγορίας βλάβης; Οι υποκατηγορίες της θα απενεργοποιηθούν επίσης.">
                            <button type="submit" class="entity-menu-action">Απενεργοποίηση</button>
                        </form>
                    </div>
                </details>
            </td>
        </tr>
        <tr class="subcategory-row">
            <td colspan="2">
                <details class="subcategory-dropdown">
                    <summary>
                        Υποκατηγορίες
                        <span class="subcategory-count"
                              th:text="'(' + ${#lists.size(activeSubcategoriesByCategory.get(category.id) ?: {}) + #lists.size(inactiveSubcategoriesByCategory.get(category.id) ?: {})} + ')'"></span>
                    </summary>

                    <ul class="subcategory-list">
                        <li th:each="sub : ${activeSubcategoriesByCategory.get(category.id) ?: {}}" class="subcategory-item" data-entity-row>
                            <span class="entity-edit-view">
                                <span th:text="${sub.name}"></span>
                                <span class="entity-ticket-count" th:text="'(' + ${sub.ticketCount} + ')'"></span>
                            </span>
                            <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/edit(catId=${category.id}, subId=${sub.id})}" class="entity-inline-edit-form" hidden="hidden">
                                <input type="text" name="name" th:value="${sub.name}" required="required" aria-label="Όνομα υποκατηγορίας">
                                <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                                <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                            </form>
                            <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                                <summary title="Επιλογές">&#8942;</summary>
                                <div class="entity-menu-panel">
                                    <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                                    <div class="entity-menu-divider"></div>
                                    <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/toggle-active(catId=${category.id}, subId=${sub.id})}">
                                        <button type="submit" class="entity-menu-action">Απενεργοποίηση</button>
                                    </form>
                                </div>
                            </details>
                        </li>
                        <li th:each="sub : ${inactiveSubcategoriesByCategory.get(category.id) ?: {}}" class="subcategory-item subcategory-item-inactive" data-entity-row>
                            <div class="entity-name-group entity-edit-view">
                                <span th:text="${sub.name}"></span>
                                <span class="entity-ticket-count" th:text="'(' + ${sub.ticketCount} + ')'"></span>
                                <span class="badge entity-status-badge status-inactive">Ανενεργή</span>
                            </div>
                            <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/edit(catId=${category.id}, subId=${sub.id})}" class="entity-inline-edit-form" hidden="hidden">
                                <input type="text" name="name" th:value="${sub.name}" required="required" aria-label="Όνομα υποκατηγορίας">
                                <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                                <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                            </form>
                            <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                                <summary title="Επιλογές">&#8942;</summary>
                                <div class="entity-menu-panel">
                                    <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                                    <div class="entity-menu-divider"></div>
                                    <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/toggle-active(catId=${category.id}, subId=${sub.id})}">
                                        <button type="submit" class="entity-menu-action">Ενεργοποίηση</button>
                                    </form>
                                    <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/delete(catId=${category.id}, subId=${sub.id})}"
                                          data-confirm="Διαγραφή αυτής της υποκατηγορίας; Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.">
                                        <button type="submit" class="entity-menu-action entity-menu-action-danger">Διαγραφή</button>
                                    </form>
                                </div>
                            </details>
                        </li>
                        <li th:if="${#lists.isEmpty(activeSubcategoriesByCategory.get(category.id) ?: {}) and #lists.isEmpty(inactiveSubcategoriesByCategory.get(category.id) ?: {})}"
                            class="empty-subcategories">
                            Δεν υπάρχουν υποκατηγορίες ακόμα.
                        </li>
                    </ul>

                    <form method="post" th:action="@{/categories/{id}/subcategories(id=${category.id})}"
                          class="add-subcategory-form" sec:authorize="hasRole('ADMIN')">
                        <input type="text" name="name" placeholder="Νέα υποκατηγορία" required="required">
                        <button type="submit" class="btn">+ Προσθήκη</button>
                    </form>
                </details>
            </td>
        </tr>
        </th:block>

        <tr class="entity-list-divider" th:if="${!inactiveCategories.isEmpty()}">
            <td colspan="2">Ανενεργές</td>
        </tr>

        <th:block th:each="category : ${inactiveCategories}">
        <tr class="entity-card entity-card-inactive" data-entity-row>
            <td class="entity-name">
                <div class="entity-name-group entity-edit-view">
                    <span th:text="${category.name}"></span>
                    <span class="entity-ticket-count" th:text="'(' + ${category.ticketCount} + ')'"></span>
                    <span class="badge entity-status-badge status-inactive">Ανενεργή</span>
                </div>
                <form method="post" th:action="@{/categories/{id}/edit(id=${category.id})}" class="entity-inline-edit-form" hidden="hidden">
                    <input type="text" name="name" th:value="${category.name}" required="required" aria-label="Όνομα κατηγορίας βλάβης">
                    <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                    <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                </form>
            </td>
            <td class="entity-actions-cell">
                <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                    <summary title="Επιλογές">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                        <div class="entity-menu-divider"></div>
                        <form method="post" th:action="@{/categories/{id}/toggle-active(id=${category.id})}">
                            <button type="submit" class="entity-menu-action">Ενεργοποίηση</button>
                        </form>
                        <form method="post" th:action="@{/categories/{id}/delete(id=${category.id})}"
                              data-confirm="Διαγραφή αυτής της κατηγορίας βλάβης; Οι υποκατηγορίες της θα διαγραφούν επίσης. Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.">
                            <button type="submit" class="entity-menu-action entity-menu-action-danger">Διαγραφή</button>
                        </form>
                    </div>
                </details>
            </td>
        </tr>
        <tr class="subcategory-row">
            <td colspan="2">
                <details class="subcategory-dropdown">
                    <summary>
                        Υποκατηγορίες
                        <span class="subcategory-count"
                              th:text="'(' + ${#lists.size(activeSubcategoriesByCategory.get(category.id) ?: {}) + #lists.size(inactiveSubcategoriesByCategory.get(category.id) ?: {})} + ')'"></span>
                    </summary>

                    <ul class="subcategory-list">
                        <li th:each="sub : ${activeSubcategoriesByCategory.get(category.id) ?: {}}" class="subcategory-item" data-entity-row>
                            <span class="entity-edit-view">
                                <span th:text="${sub.name}"></span>
                                <span class="entity-ticket-count" th:text="'(' + ${sub.ticketCount} + ')'"></span>
                            </span>
                            <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/edit(catId=${category.id}, subId=${sub.id})}" class="entity-inline-edit-form" hidden="hidden">
                                <input type="text" name="name" th:value="${sub.name}" required="required" aria-label="Όνομα υποκατηγορίας">
                                <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                                <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                            </form>
                            <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                                <summary title="Επιλογές">&#8942;</summary>
                                <div class="entity-menu-panel">
                                    <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                                    <div class="entity-menu-divider"></div>
                                    <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/toggle-active(catId=${category.id}, subId=${sub.id})}">
                                        <button type="submit" class="entity-menu-action">Απενεργοποίηση</button>
                                    </form>
                                </div>
                            </details>
                        </li>
                        <li th:each="sub : ${inactiveSubcategoriesByCategory.get(category.id) ?: {}}" class="subcategory-item subcategory-item-inactive" data-entity-row>
                            <div class="entity-name-group entity-edit-view">
                                <span th:text="${sub.name}"></span>
                                <span class="entity-ticket-count" th:text="'(' + ${sub.ticketCount} + ')'"></span>
                                <span class="badge entity-status-badge status-inactive">Ανενεργή</span>
                            </div>
                            <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/edit(catId=${category.id}, subId=${sub.id})}" class="entity-inline-edit-form" hidden="hidden">
                                <input type="text" name="name" th:value="${sub.name}" required="required" aria-label="Όνομα υποκατηγορίας">
                                <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                                <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                            </form>
                            <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                                <summary title="Επιλογές">&#8942;</summary>
                                <div class="entity-menu-panel">
                                    <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                                    <div class="entity-menu-divider"></div>
                                    <form method="post" th:action="@{/categories/{catId}/subcategories/{subId}/delete(catId=${category.id}, subId=${sub.id})}"
                                          data-confirm="Διαγραφή αυτής της υποκατηγορίας;">
                                        <button type="submit" class="entity-menu-action entity-menu-action-danger">Διαγραφή</button>
                                    </form>
                                </div>
                            </details>
                        </li>
                        <li th:if="${#lists.isEmpty(activeSubcategoriesByCategory.get(category.id) ?: {}) and #lists.isEmpty(inactiveSubcategoriesByCategory.get(category.id) ?: {})}"
                            class="empty-subcategories">
                            Δεν υπάρχουν υποκατηγορίες ακόμα.
                        </li>
                    </ul>
                </details>
            </td>
        </tr>
        </th:block>

        <tr th:if="${activeCategories.isEmpty() and inactiveCategories.isEmpty()}">
            <td colspan="2" class="empty-state">Δεν υπάρχουν κατηγορίες βλάβης ακόμα.</td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
