<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: modals}"></div>

<main class="page">
    <div class="page-header">
        <h1>Departments</h1>
    </div>

    <form th:object="${departmentCreateRequest}" method="post" th:action="@{/departments}" class="filters" sec:authorize="hasRole('ADMIN')">
        <input type="text" th:field="*{name}" placeholder="New department name" required="required">
        <button type="submit" class="btn btn-primary">+ Add Department</button>
    </form>

    <div class="entity-list">
        <div class="entity-card" th:each="department : ${activeDepartments}">
            <div class="entity-card-header">
                <span class="entity-name" th:text="${department.name}"></span>
                <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                    <summary title="Options">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <form method="post" th:action="@{/departments/{id}/edit(id=${department.id})}" class="entity-menu-edit">
                            <input type="text" name="name" th:value="${department.name}" required="required" aria-label="Department name">
                            <button type="submit" class="btn btn-sm">Save</button>
                        </form>
                        <div class="entity-menu-divider"></div>
                        <form method="post" th:action="@{/departments/{id}/toggle-active(id=${department.id})}">
                            <button type="submit" class="entity-menu-action">Deactivate</button>
                        </form>
                    </div>
                </details>
            </div>
        </div>

        <h2 class="entity-list-divider" th:if="${!inactiveDepartments.isEmpty()}">Inactive</h2>

        <div class="entity-card entity-card-inactive" th:each="department : ${inactiveDepartments}">
            <div class="entity-card-header">
                <div class="entity-name-group">
                    <span class="entity-name" th:text="${department.name}"></span>
                    <span class="badge entity-status-badge status-inactive">Inactive</span>
                </div>
                <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                    <summary title="Options">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <form method="post" th:action="@{/departments/{id}/edit(id=${department.id})}" class="entity-menu-edit">
                            <input type="text" name="name" th:value="${department.name}" required="required" aria-label="Department name">
                            <button type="submit" class="btn btn-sm">Save</button>
                        </form>
                        <div class="entity-menu-divider"></div>
                        <form method="post" th:action="@{/departments/{id}/toggle-active(id=${department.id})}">
                            <button type="submit" class="entity-menu-action">Activate</button>
                        </form>
                        <form method="post" th:action="@{/departments/{id}/delete(id=${department.id})}"
                              data-confirm="Delete this department? This cannot be undone.">
                            <button type="submit" class="entity-menu-action entity-menu-action-danger">Delete</button>
                        </form>
                    </div>
                </details>
            </div>
        </div>

        <p th:if="${activeDepartments.isEmpty() and inactiveDepartments.isEmpty()}" class="empty-state">No departments yet.</p>
    </div>
</main>

</body>
</html>
