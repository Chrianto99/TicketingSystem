<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <script th:replace="~{fragments/nav :: theme-init}"></script>
    <title>Τμήματα</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: modals}"></div>

<main class="page">
    <div class="page-header">
        <h1>Τμήματα</h1>
    </div>

    <form th:object="${departmentCreateRequest}" method="post" th:action="@{/departments}" class="filters" sec:authorize="hasRole('ADMIN')">
        <input type="text" th:field="*{name}" placeholder="Νέο τμήμα" required="required">
        <input type="text" th:field="*{code}" placeholder="Κωδικός (προαιρετικό)">
        <button type="submit" class="btn btn-primary">+ Προσθήκη Τμήματος</button>
    </form>

    <div class="filters">
        <input type="text" id="department-search" placeholder="Αναζήτηση τμημάτων...">
    </div>

    <table class="entity-table">
        <thead>
        <tr>
            <th>Όνομα</th>
            <th>Κωδικός</th>
<!--            <th>Κατάσταση</th>-->
            <th></th>
        </tr>
        </thead>
        <tbody id="department-list">
        <tr class="entity-card" th:each="department : ${activeDepartments}" data-entity-row>
            <td class="entity-name">
                <span class="entity-edit-view" th:text="${department.name}"></span>
                <form method="post" th:action="@{/departments/{id}/edit(id=${department.id})}" class="entity-inline-edit-form" hidden="hidden">
                    <input type="text" name="name" th:value="${department.name}" required="required" placeholder="Όνομα" aria-label="Όνομα τμήματος">
                    <input type="text" name="code" th:value="${department.code}" placeholder="Κωδικός" aria-label="Κωδικός τμήματος">
                    <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                    <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                </form>
            </td>
            <td><span class="entity-code entity-edit-view" th:if="${not #strings.isEmpty(department.code)}" th:text="${department.code}"></span></td>
<!--            <td><span class="badge entity-status-badge status-active">Ενεργό</span></td>-->
            <td class="entity-actions-cell">
                <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                    <summary title="Επιλογές">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                        <div class="entity-menu-divider"></div>
                        <form method="post" th:action="@{/departments/{id}/toggle-active(id=${department.id})}">
                            <button type="submit" class="entity-menu-action">Απενεργοποίηση</button>
                        </form>
                    </div>
                </details>
            </td>
        </tr>

        <tr class="entity-list-divider" th:if="${!inactiveDepartments.isEmpty()}">
            <td colspan="4">Ανενεργά</td>
        </tr>

        <tr class="entity-card entity-card-inactive" th:each="department : ${inactiveDepartments}" data-entity-row>
            <td class="entity-name">
                <span class="entity-edit-view" th:text="${department.name}"></span>
                <form method="post" th:action="@{/departments/{id}/edit(id=${department.id})}" class="entity-inline-edit-form" hidden="hidden">
                    <input type="text" name="name" th:value="${department.name}" required="required" placeholder="Όνομα" aria-label="Όνομα τμήματος">
                    <input type="text" name="code" th:value="${department.code}" placeholder="Κωδικός" aria-label="Κωδικός τμήματος">
                    <button type="submit" class="btn btn-sm">Αποθήκευση</button>
                    <button type="button" class="btn btn-sm js-edit-cancel">Άκυρο</button>
                </form>
            </td>
            <td><span class="entity-code entity-edit-view" th:if="${not #strings.isEmpty(department.code)}" th:text="${department.code}"></span></td>
            <td><span class="badge entity-status-badge status-inactive">Ανενεργό</span></td>
            <td class="entity-actions-cell">
                <details class="entity-menu" sec:authorize="hasRole('ADMIN')">
                    <summary title="Επιλογές">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <button type="button" class="entity-menu-action js-edit-trigger">Επεξεργασία</button>
                        <div class="entity-menu-divider"></div>
                        <form method="post" th:action="@{/departments/{id}/toggle-active(id=${department.id})}">
                            <button type="submit" class="entity-menu-action">Ενεργοποίηση</button>
                        </form>
                        <form method="post" th:action="@{/departments/{id}/delete(id=${department.id})}"
                              data-confirm="Διαγραφή αυτού του τμήματος; Αυτή η ενέργεια δεν μπορεί να αναιρεθεί.">
                            <button type="submit" class="entity-menu-action entity-menu-action-danger">Διαγραφή</button>
                        </form>
                    </div>
                </details>
            </td>
        </tr>

        <tr th:if="${activeDepartments.isEmpty() and inactiveDepartments.isEmpty()}">
            <td colspan="4" class="empty-state">Δεν υπάρχουν τμήματα ακόμα.</td>
        </tr>
        <tr id="department-search-empty" hidden="hidden">
            <td colspan="4" class="empty-state">Κανένα τμήμα δεν ταιριάζει με την αναζήτησή σας.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
           th:href="@{/departments(page=${i}, size=${pageSize})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? ' active'"
           class="page-link"></a>
    </div>
</main>

<script th:src="@{/js/departments.js}"></script>
</body>
</html>
