<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<script th:fragment="theme-init">document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>

<nav class="navbar" th:fragment="nav">
    <div class="navbar-brand"><a th:href="@{/tickets}"><img th:src="@{/img/gepLogo.png}" alt="Ticketing System" class="navbar-logo"></a></div>
    <div class="navbar-links">
        <a th:href="@{/tickets}">Tickets</a>
        <a th:href="@{/incidents}">Συμβάντα</a>
        <a th:href="@{/departments}">Διαχείριση</a>
        <a th:href="@{/statistics}">Στατιστικά</a>
    </div>
    <div class="navbar-user">
        <button type="button" id="notifications-toggle" class="theme-toggle" hidden="hidden"
                aria-label="Ενεργοποίηση ειδοποιήσεων browser" title="Ενεργοποίηση ειδοποιήσεων browser">🔔</button>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Εναλλαγή σκοτεινού θέματος" title="Εναλλαγή σκοτεινού θέματος">
            <span class="icon-moon">🌙</span>
            <span class="icon-sun">☀️</span>
        </button>
        <a th:href="@{/profile}" class="navbar-avatar" title="Το προφίλ μου"
           th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}"></a>
        <span sec:authentication="name">username</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-link">Αποσύνδεση</button>
        </form>
    </div>
</nav>

<div class="page-tabs" th:fragment="admin-tabs(active)">
    <a th:href="@{/departments}" class="page-tab" th:classappend="${active == 'departments'} ? ' active'">Τμήματα</a>
    <a th:href="@{/categories}" class="page-tab" th:classappend="${active == 'categories'} ? ' active'">Κατηγορίες Βλάβης</a>
    <a th:href="@{/users}" class="page-tab" th:classappend="${active == 'users'} ? ' active'">Χρήστες</a>
    <a th:href="@{/attachments/cleanup}" class="page-tab" sec:authorize="hasRole('ADMIN')" th:classappend="${active == 'attachments'} ? ' active'">Συνημμένα</a>
</div>

<div th:fragment="modals">
    <div th:if="${errorMessage}" id="server-error-message" th:text="${errorMessage}" hidden="hidden"></div>

    <dialog id="confirm-modal" class="modal-dialog modal-dialog-sm">
        <div class="modal-header">
            <div class="modal-header-top">
                <h2>Επιβεβαίωση</h2>
                <button type="button" class="modal-close" aria-label="Κλείσιμο" id="confirm-modal-close">&times;</button>
            </div>
        </div>
        <div class="modal-body">
            <p id="confirm-modal-message"></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn" id="confirm-modal-cancel">Άκυρο</button>
            <button type="button" class="btn btn-primary" id="confirm-modal-ok">Επιβεβαίωση</button>
        </div>
    </dialog>

    <dialog id="error-modal" class="modal-dialog modal-dialog-sm">
        <div class="modal-header">
            <div class="modal-header-top">
                <h2>Σφάλμα</h2>
                <button type="button" class="modal-close" aria-label="Κλείσιμο" id="error-modal-close">&times;</button>
            </div>
        </div>
        <div class="modal-body">
            <p id="error-modal-message" class="modal-error"></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="error-modal-ok">Εντάξει</button>
        </div>
    </dialog>

    <script th:src="@{/js/common.js}"></script>
</div>
</body>
</html>
