<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:replace="~{fragments/nav :: theme-init}"></script>
    <title>Tickets</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body th:attr="data-current-user-id=${#authentication.principal.id}, data-is-admin=${#authorization.expression('hasRole(''ADMIN'')')}">
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: modals}"></div>

<main class="page">
    <div class="page-header">
        <div class="page-tabs">
            <a th:href="@{/tickets(scope='assigned')}" th:classappend="${scope == 'assigned'} ? ' active'" class="page-tab">Τα Tickets μου<span id="my-tickets-dot" class="notif-dot" th:classappend="${hasUnseenAssignedTickets} ? ' visible'"></span></a>
            <a th:href="@{/tickets(scope='all')}" th:classappend="${scope != 'assigned'} ? ' active'" class="page-tab">Όλα τα Tickets</a>
        </div>
        <button type="button" class="btn btn-primary" onclick="openCreateTicketModal()">+ Νέο Ticket</button>
    </div>

    <form class="filters" method="get" th:action="@{/tickets}">

        <input type="hidden" name="scope" th:value="${scopeParam}">

        <input type="search" name="query" id="ticket-description-search" class="filters-search-full"
               placeholder="Αναζήτηση με βάση τίτλο, τμήμα, κατηγορία, υποκατηγορία ή ανάδοχο..." th:value="${query}" autocomplete="off">

        <select name="status" onchange="this.form.submit()">
            <option value="ALL" th:selected="${status == null}">Όλες οι καταστάσεις</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == status}"></option>
        </select>
        <select name="priority" onchange="this.form.submit()">
            <option value="">Όλες οι προτεραιότητες</option>
            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName}" th:selected="${p == priority}"></option>
        </select>
        <select name="source" onchange="this.form.submit()">
            <option value="">Όλες οι προελεύσεις</option>
            <option th:each="s : ${sources}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == source}"></option>
        </select>
        <a th:if="${statusFilterActive or priority != null or source != null or not #strings.isEmpty(query)}"
           th:href="@{/tickets(scope=${scopeParam})}" class="btn">Καθαρισμός φίλτρων</a>
    </form>

    <table class="ticket-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Περίληψη</th>
            <th>Κατάσταση</th>
            <th>Προτεραιότητα</th>
            <th>Προέλευση</th>
            <th>Τμήμα</th>
            <th>Ανατέθηκε σε</th>
            <th>Δημιουργήθηκε</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${ticketPage.content}" class="ticket-row" th:attr="data-ticket-id=${ticket.id}">
            <td class="ticket-id" th:text="'#' + ${ticket.id}"></td>
            <td class="ticket-desc" th:text="${ticket.summary}"></td>
            <td><span class="badge" th:classappend="'status-' + ${ticket.status}" th:text="${ticket.status.displayName}"></span></td>
            <td>
                <span class="badge" th:if="${ticket.priority}" th:classappend="'priority-' + ${ticket.priority}" th:text="${ticket.priority.displayName}"></span>
                <span th:unless="${ticket.priority}">—</span>
            </td>
            <td><span class="badge" th:classappend="'source-' + ${ticket.source}" th:text="${ticket.source.displayName}"></span></td>
            <td th:text="${ticket.departmentName} ?: '—'"></td>
            <td th:text="${ticket.assignedUsername} ?: 'Χωρίς ανάθεση'"></td>
            <td th:text="${#temporals.format(ticket.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
        </tr>
        <tr th:if="${ticketPage.content.isEmpty()}">
            <td colspan="8" class="empty-state">Δεν βρέθηκαν tickets.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${ticketPage.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, ticketPage.totalPages - 1)}"
           th:href="@{/tickets(page=${i}, size=${ticketPage.size}, status=${statusParam}, priority=${priority}, source=${source}, scope=${scopeParam}, query=${query})}"
           th:text="${i + 1}"
           th:classappend="${i == ticketPage.number} ? ' active'"
           class="page-link"></a>
    </div>
</main>

<dialog id="ticket-modal" class="modal-dialog">
    <div class="modal-header">
        <div class="modal-header-top">
            <div class="modal-title-row">
                <h2 id="modal-title">Ticket</h2>
                <span id="modal-status-badge" class="badge"></span>
                <span id="modal-priority-badge" class="badge"></span>
                <span id="modal-source-badge" class="badge"></span>
            </div>
            <div class="modal-header-actions">
                <details class="entity-menu" id="ticket-modal-menu">
                    <summary title="Επιλογές">&#8942;</summary>
                    <div class="entity-menu-panel">
                        <button type="button" class="entity-menu-action" id="ticket-menu-edit-btn">Επεξεργασία</button>
                        <div class="entity-menu-divider"></div>
                        <button type="button" class="entity-menu-action entity-menu-action-danger" id="ticket-menu-cancel-btn">Ακύρωση Ticket</button>
                    </div>
                </details>
                <button type="button" class="modal-close" aria-label="Κλείσιμο" onclick="document.getElementById('ticket-modal').close()">&times;</button>
            </div>
        </div>
        <p id="modal-meta" class="modal-meta"></p>
    </div>
    <div id="modal-body" class="modal-body ticket-form">
        <p>Φόρτωση…</p>
    </div>
    <div id="modal-footer" class="modal-footer" style="display:none;"></div>
</dialog>

<dialog id="action-modal" class="modal-dialog modal-dialog-sm">
    <div class="modal-header">
        <div class="modal-header-top">
            <h2 id="action-modal-title">Ενέργεια</h2>
            <button type="button" class="modal-close" aria-label="Κλείσιμο" id="action-modal-close">&times;</button>
        </div>
    </div>
    <form id="action-modal-form" method="post">
        <div class="modal-body ticket-form">
            <input type="hidden" name="_csrf" id="action-modal-csrf">
            <div class="form-group">
                <label for="action-modal-comment" id="action-modal-comment-label">Σχόλιο</label>
                <textarea id="action-modal-comment" name="commentText" required="required"></textarea>
                <button type="button" class="resolution-suggestion" id="action-modal-suggestion">✓ Επιλύθηκε</button>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-icon-only" id="action-modal-cancel" title="Άκυρο" aria-label="Άκυρο">✗</button>
            <button type="submit" class="btn btn-primary btn-icon-only" id="action-modal-submit" title="Επιβεβαίωση" aria-label="Επιβεβαίωση">✓</button>
        </div>
    </form>
</dialog>

<dialog id="create-ticket-modal" class="modal-dialog" th:attr="data-has-errors=${#fields.hasErrors('ticketCreateRequest.*')}">
    <div class="modal-header">
        <div class="modal-header-top">
            <h2>Νέο Ticket</h2>
            <button type="button" class="modal-close" aria-label="Κλείσιμο" onclick="document.getElementById('create-ticket-modal').close()">&times;</button>
        </div>
    </div>
    <form th:object="${ticketCreateRequest}" th:action="@{/tickets}" method="post" class="ticket-form" autocomplete="off">
        <div class="modal-body">
            <div class="form-group">
                <label for="ct-phone">Αριθμός τηλεφώνου <span class="required-mark">*</span></label>
                <input type="text" id="ct-phone" th:field="*{phoneNumber}" required="required" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
            </div>

            <div class="form-group">
                <label for="ct-caller-name">Όνομα καλούντος</label>
                <input type="text" id="ct-caller-name" th:field="*{callerName}" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('callerName')}" th:errors="*{callerName}"></span>
            </div>

            <div class="form-group">
                <label for="ct-department-input">Τμήμα</label>
                <div class="combobox" id="ct-department-combobox">
                    <input type="text" id="ct-department-input" autocomplete="off" placeholder="Πληκτρολογήστε για αναζήτηση τμήματος…">
                    <select id="ct-department" th:field="*{departmentId}" hidden="hidden">
                        <option value="">Επιλέξτε τμήμα</option>
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                    </select>
                    <ul class="combobox-options" id="ct-department-options" hidden="hidden"></ul>
                </div>
                <span class="field-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></span>
            </div>

            <div class="form-group">
                <label for="ct-ip">Διεύθυνση IP</label>
                <input type="text" id="ct-ip" th:field="*{ipAddress}" placeholder="Προαιρετικό" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('ipAddress')}" th:errors="*{ipAddress}"></span>
            </div>

            <div class="form-group">
                <label for="ct-category">Κατηγορία Βλάβης <span class="required-mark">*</span></label>
                <select id="ct-category" th:field="*{categoryId}" required="required">
                    <option value="">Επιλέξτε κατηγορία βλάβης</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
            </div>

            <div class="form-group">
                <label for="ct-subcategory">Υποκατηγορία</label>
                <select id="ct-subcategory" th:field="*{subcategoryId}" th:attr="data-initial-value=${ticketCreateRequest.subcategoryId}" disabled="disabled">
                    <option value="">Επιλέξτε πρώτα κατηγορία βλάβης</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('subcategoryId')}" th:errors="*{subcategoryId}"></span>
            </div>

            <div class="form-group">
                <label for="ct-assignee">Αναθέστε αλλού <span class="required-mark">*</span></label>
                <select id="ct-assignee" th:field="*{assignedUserId}" required="required">
                    <option th:each="u : ${users}" th:value="${u.id}"
                            th:text="${u.specialization} ? ${u.username} + ' (' + ${u.specialization} + ')' : ${u.username}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('assignedUserId')}" th:errors="*{assignedUserId}"></span>
            </div>

            <div class="form-group">
                <label for="ct-priority">Προτεραιότητα <span class="required-mark">*</span></label>
                <select id="ct-priority" th:field="*{priority}" required="required">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></span>
            </div>

            <div class="form-group">
                <label for="ct-summary">Τίτλος</label>
                <input type="text" id="ct-summary" th:field="*{summary}" placeholder="Σύντομη περιγραφή του προβλήματος" autocomplete="off">
                <span class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></span>
            </div>

            <div class="form-group">
                <label for="ct-description">Λεπτομέρειες (προαιρετικό)</label>
                <textarea id="ct-description" th:field="*{description}" placeholder="Περιγράψτε το πρόβλημα αναλυτικά…" autocomplete="off"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-group">
                <label for="ct-resolution">Λύση (προαιρετικό)</label>
                <textarea id="ct-resolution" th:field="*{resolution}" placeholder="Αν συμπληρωθεί, το ticket θα δημιουργηθεί ως επιλυμένο…" autocomplete="off"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('resolution')}" th:errors="*{resolution}"></span>
            </div>
        </div>
        <div class="modal-footer">
            <button type="submit" name="action" value="open" class="btn btn-primary">Άνοιγμα Ticket</button>
            <button type="submit" th:formaction="@{/tickets/callback}" formnovalidate="formnovalidate" class="btn"
                    title="Ο καλών ζητάει μόνο επιστροφή κλήσης — αγνοεί τμήμα/κατηγορία/λύση">↺ Callback</button>
        </div>
    </form>
</dialog>

<script th:src="@{/js/tickets.js}"></script>
</body>
</html>
