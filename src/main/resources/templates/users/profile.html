<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:replace="~{fragments/nav :: theme-init}"></script>
    <title>Το προφίλ μου</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/nav :: modals}"></div>

<main class="page page-narrow">
    <div class="page-header">
        <h1>Το προφίλ μου</h1>
    </div>

    <p th:if="${param.updated != null}" class="success-banner">Το προφίλ ενημερώθηκε.</p>
    <p th:if="${param.passwordChanged != null}" class="success-banner">Ο κωδικός πρόσβασης άλλαξε.</p>

    <div class="profile-section-heading">
        <h3>Στοιχεία λογαριασμού</h3>
        <button type="button" id="profile-edit-btn" class="icon-btn" title="Επεξεργασία" th:hidden="${#fields.hasErrors('userProfileUpdateRequest.*')}">&#9998;</button>
    </div>
    <form id="profile-form" th:object="${userProfileUpdateRequest}" th:action="@{/profile}" method="post" class="ticket-form">
        <div class="form-group">
            <label for="p-username">Όνομα χρήστη</label>
            <input type="text" id="p-username" th:value="${user.username}" disabled="disabled">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="p-first-name">Όνομα</label>
                <input type="text" id="p-first-name" th:field="*{firstName}" th:disabled="${!#fields.hasErrors('*')}">
            </div>
            <div class="form-group">
                <label for="p-last-name">Επώνυμο</label>
                <input type="text" id="p-last-name" th:field="*{lastName}" th:disabled="${!#fields.hasErrors('*')}">
            </div>
        </div>

        <div class="form-group">
            <label for="p-email">Email (προαιρετικό)</label>
            <input type="email" id="p-email" th:field="*{email}" th:disabled="${!#fields.hasErrors('*')}">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label for="p-phone">Αριθμός τηλεφώνου (προαιρετικό)</label>
            <input type="text" id="p-phone" th:field="*{phoneNumber}" th:disabled="${!#fields.hasErrors('*')}">
            <span class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
        </div>

        <div class="form-group">
            <label for="p-specialization">Εξειδίκευση (προαιρετικό)</label>
            <input type="text" id="p-specialization" th:field="*{specialization}" th:disabled="${!#fields.hasErrors('*')}">
            <span class="field-error" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></span>
        </div>

        <div class="form-group">
            <label for="p-role">Ρόλος</label>
            <input type="text" id="p-role" th:value="${user.role.displayName}" disabled="disabled">
        </div>

        <div class="form-actions">
            <button type="submit" id="profile-save-btn" class="btn btn-primary" th:hidden="${!#fields.hasErrors('*')}">Αποθήκευση αλλαγών</button>
            <button type="button" id="profile-cancel-btn" class="btn" th:hidden="${!#fields.hasErrors('*')}">Άκυρο</button>
        </div>
    </form>

    <h3>Αλλαγή κωδικού πρόσβασης</h3>
    <form th:object="${changePasswordRequest}" th:action="@{/profile/password}" method="post" class="ticket-form">
        <div class="form-group">
            <label for="p-current-password">Τρέχων κωδικός πρόσβασης</label>
            <input type="password" id="p-current-password" th:field="*{currentPassword}" required="required">
            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        </div>

        <div class="form-group">
            <label for="p-new-password">Νέος κωδικός πρόσβασης</label>
            <input type="password" id="p-new-password" th:field="*{newPassword}" required="required" minlength="8">
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </div>

        <div class="form-group">
            <label for="p-confirm-password">Επιβεβαίωση νέου κωδικού</label>
            <input type="password" id="p-confirm-password" th:field="*{confirmPassword}" required="required" minlength="8">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Αλλαγή κωδικού</button>
        </div>
    </form>
</main>

<script th:src="@{/js/profile.js}"></script>
</body>
</html>
